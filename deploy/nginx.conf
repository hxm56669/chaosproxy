events {}
http {
  resolver 127.0.0.11 valid=10s;
  upstream phototask_api {
    zone phototask_api 64k;
    server api-a:8080 resolve;
    server api-b:8080 resolve;
  }
  server {
    listen 8080;
    location = /livez { proxy_pass http://phototask_api; proxy_next_upstream off; }
    location = /readyz { proxy_pass http://phototask_api; proxy_next_upstream off; }
    location = /metrics { proxy_pass http://phototask_api; proxy_next_upstream off; }
    location /v1/tasks {
      proxy_pass http://phototask_api;
      proxy_next_upstream off;
    }
    location /v1/photos {
      proxy_pass http://phototask_api;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
