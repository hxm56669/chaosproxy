services:
  api-a:
    image: phototask:local
    command: ["photo_runtime", "--listen", "0.0.0.0:8080"]
    environment: ["PHOTOTASK_DB_HOST=mysql", "PHOTOTASK_REDIS_HOST=redis"]
    volumes: ["photo-data:/var/lib/phototask"]
  api-b:
    image: phototask:local
    command: ["photo_runtime", "--listen", "0.0.0.0:8080"]
    environment: ["PHOTOTASK_DB_HOST=mysql", "PHOTOTASK_REDIS_HOST=redis"]
    volumes: ["photo-data:/var/lib/phototask"]
  nginx:
    image: nginx:1.28.3
    ports: ["8080:8080"]
    depends_on: [api-a, api-b]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
volumes:
  photo-data:
